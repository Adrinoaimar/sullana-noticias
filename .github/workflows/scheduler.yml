name: Sullana Noticias · scheduler

on:
  # La ejecución automática vive en ingest.yml, que también se puede reutilizar.
  # Este workflow queda como disparador manual de respaldo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
