name: Sullana Noticias · scheduler

on:
  # Respaldo manual del workflow reutilizable; el cron vive en
  # scheduled-ingest.yml para aislar el registro periódico.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
