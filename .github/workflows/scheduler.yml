name: Sullana Noticias · scheduler

on:
  # Wrapper manual de compatibilidad; los turnos automáticos viven en
  # scheduled-ingest.yml y en el Worker Cloudflare escalonado.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
