name: Sullana Noticias · scheduler

on:
  # El wrapper es el único disparador periódico y reutiliza el workflow de
  # ingesta. El intervalo es aproximadamente cada 30 minutos, fuera de
  # :00/:30 para reducir retrasos.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
