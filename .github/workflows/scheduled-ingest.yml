name: Sullana Noticias · scheduled ingest

on:
  schedule:
    # The caller owns the periodic trigger; ingest.yml remains reusable.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sullana-facebook-ingest-scheduler
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
