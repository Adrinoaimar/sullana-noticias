name: Sullana Noticias · scheduled ingest

on:
  # Manual compatibility entrypoint; automatic cron lives in ingest.yml.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sullana-facebook-ingest-scheduler
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
