name: Sullana Noticias · scheduled ingest

on:
  schedule:
    # Isolated scheduler; the reusable ingest workflow owns the scraper job.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sullana-facebook-ingest-scheduler
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
