name: Sullana Noticias · scheduled ingest

on:
  # Cloudflare owns the clock and dispatches this workflow. GitHub Actions
  # remains the Linux + Chromium/Playwright runner.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sullana-facebook-ingest-scheduler
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/ingest.yml
    secrets: inherit
    with:
      scope: all
      publish_safe: true
