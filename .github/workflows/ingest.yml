name: Sullana Noticias · ingesta pública

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar adapter
        run: python -m pip install -r services/facebook-ingestor/requirements.txt
      - name: Ejecutar adapter y enviar payload firmado
        env:
          SULLANA_INGEST_URL: ${{ secrets.SULLANA_INGEST_URL }}
          SULLANA_INGEST_TOKEN: ${{ secrets.SULLANA_INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.request
          from pathlib import Path

          endpoint = os.environ.get("SULLANA_INGEST_URL", "").strip()
          token = os.environ.get("SULLANA_INGEST_TOKEN", "").strip()
          if not endpoint or not token:
              raise SystemExit("Missing SULLANA_INGEST_URL or SULLANA_INGEST_TOKEN repository secrets")
          sources = json.loads(Path("config/public-sources.json").read_text())
          request = {"sources": sources, "page_limit": 3, "timeout": 25, "retries": 2, "min_interval": 30}
          run = subprocess.run([sys.executable, "services/facebook-ingestor/run.py"], input=json.dumps(request), text=True, capture_output=True, check=False)
          if not run.stdout.strip():
              raise SystemExit(run.stderr or "adapter returned no JSON")
          payload = json.loads(run.stdout)
          body = json.dumps(payload).encode()
          req = urllib.request.Request(endpoint, data=body, method="POST", headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "User-Agent": "SullanaNoticiasIngest/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read())
              print(json.dumps({"http_status": response.status, "status": result.get("status"), "posts_found": result.get("posts_found"), "new_posts": result.get("new_posts"), "errors": len(result.get("errors", []))}))
          if payload.get("errors") and not payload.get("posts"):
              raise SystemExit("No public posts were parsed; see adapter errors above")
          PY
