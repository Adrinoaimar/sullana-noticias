name: Sullana Noticias · ingesta pública

on:
  schedule:
    # Desplazado de :00/:30 para reducir retrasos por congestión de Actions.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Fuentes para una prueba manual"
        required: false
        default: all
        type: choice
        options:
          - all
          - chilalo-churre

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/facebook-ingestor/requirements.txt
          python -m playwright install chromium
      - name: Ejecutar adapter y enviar payload firmado
        env:
          SULLANA_INGEST_URL: ${{ secrets.SULLANA_INGEST_URL }}
          SULLANA_INGEST_TOKEN: ${{ secrets.SULLANA_INGEST_TOKEN }}
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
          SULLANA_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            export PLAYWRIGHT_HEADLESS=0
            run_prefix=(xvfb-run -a)
          else
            export PLAYWRIGHT_HEADLESS=1
            run_prefix=()
          fi
          "${run_prefix[@]}" python - <<'PY'
          import json, os, subprocess, sys, urllib.error, urllib.request
          from urllib.parse import urlsplit, urlunsplit
          from pathlib import Path

          endpoint = os.environ.get("SULLANA_INGEST_URL", "").strip()
          token = os.environ.get("SULLANA_INGEST_TOKEN", "").strip()
          if not endpoint or not token:
              raise SystemExit("Missing SULLANA_INGEST_URL or SULLANA_INGEST_TOKEN repository secrets")
          sources = json.loads(Path("config/public-sources.json").read_text())
          remote_sources = None
          endpoint_parts = urlsplit(endpoint)
          endpoint_path = endpoint_parts.path.rstrip("/")
          if endpoint_path.endswith("/api/ingest"):
              endpoint_path = endpoint_path[:-len("/api/ingest")] + "/api/ingest-sources"
          else:
              endpoint_path = "/api/ingest-sources"
          sources_endpoint = urlunsplit((endpoint_parts.scheme, endpoint_parts.netloc, endpoint_path, "", ""))
          try:
              source_request = urllib.request.Request(sources_endpoint, method="GET", headers={"Authorization": f"Bearer {token}", "User-Agent": "SullanaNoticiasIngest/1.0"})
              with urllib.request.urlopen(source_request, timeout=30) as source_response:
                  source_payload = json.loads(source_response.read())
              if isinstance(source_payload, dict) and isinstance(source_payload.get("sources"), list):
                  remote_sources = source_payload["sources"]
                  print(f"Loaded {len(remote_sources)} enabled source(s) from D1")
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError) as error:
              print(f"WARN active source list unavailable; using repository config: {type(error).__name__}", file=sys.stderr)
          if remote_sources is not None:
              sources = remote_sources
          if os.environ.get("SULLANA_SCOPE") == "chilalo-churre":
              focus = {"ElChilaloNoticias", "elchurrenoticiasoficialsullana"}
              sources = [source for source in sources if source.get("facebook_identifier") in focus]
          request = {"sources": sources, "page_limit": 8, "timeout": 25, "retries": 2, "min_interval": 30, "scroll_limit": 5, "max_workers": 2}
          run = subprocess.run([sys.executable, "services/facebook-ingestor/run.py"], input=json.dumps(request), text=True, capture_output=True, check=False)
          if run.stderr.strip():
              print(run.stderr, file=sys.stderr, end="")
          if not run.stdout.strip():
              raise SystemExit(run.stderr or "adapter returned no JSON")
          payload = json.loads(run.stdout)
          body = json.dumps(payload).encode()
          req = urllib.request.Request(endpoint, data=body, method="POST", headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "User-Agent": "SullanaNoticiasIngest/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read())
              media = [item for post in payload.get("posts", []) for item in post.get("media", []) if isinstance(item, dict)]
              print(json.dumps({"http_status": response.status, "status": result.get("status"), "posts_found": result.get("posts_found"), "new_posts": result.get("new_posts"), "media_items": len(media), "media_images": sum(item.get("kind") == "image" for item in media), "media_videos": sum(item.get("kind") == "video" for item in media), "errors": len(result.get("errors", []))}))
          if payload.get("errors") and not payload.get("posts"):
              raise SystemExit("No public posts were parsed; see adapter errors above")
          PY
